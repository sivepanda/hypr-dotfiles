# output: ~/.config/hypr/colors.conf
# Shared color palette for hyprland and hyprlock

# Base colors
$bg = rgba(16130bff)
$fg = rgba(e9e2d4ff)
$surface = rgba(16130bff)
$surface_variant = rgba(4b4739ff)
$outline = rgba(979080ff)

# Primary
$primary = rgba(ddc66eff)
$on_primary = rgba(3a3000ff)
$primary_container = rgba(544600ff)

# Secondary
$secondary = rgba(d2c6a1ff)
$on_secondary = rgba(373016ff)
$secondary_container = rgba(4e462aff)

# Tertiary
$tertiary = rgba(aad0b2ff)
$on_tertiary = rgba(153722ff)
$tertiary_container = rgba(2c4e37ff)

# Error
$error = rgba(ffb4abff)
$on_error = rgba(690005ff)

# Semi-transparent variants (useful for borders, shadows)
$primary_dim = rgba(ddc66eaa)
$secondary_dim = rgba(d2c6a166)
$surface_dim = rgba(16130bee)
$outline_dim = rgba(979080aa)
