# output: ~/.config/hypr/colors.conf
# Shared color palette for hyprland and hyprlock

# Base colors
$bg = rgba(16130bff)
$fg = rgba(e9e2d4ff)
$surface = rgba(16130bff)
$surface_variant = rgba(4b4639ff)
$outline = rgba(979080ff)

# Primary
$primary = rgba(dfc56dff)
$on_primary = rgba(3b2f00ff)
$primary_container = rgba(564500ff)

# Secondary
$secondary = rgba(d3c6a1ff)
$on_secondary = rgba(383016ff)
$secondary_container = rgba(4f462aff)

# Tertiary
$tertiary = rgba(abd0b0ff)
$on_tertiary = rgba(173721ff)
$tertiary_container = rgba(2e4e36ff)

# Error
$error = rgba(ffb4abff)
$on_error = rgba(690005ff)

# Semi-transparent variants (useful for borders, shadows)
$primary_dim = rgba(dfc56daa)
$secondary_dim = rgba(d3c6a166)
$surface_dim = rgba(16130bee)
$outline_dim = rgba(979080aa)
