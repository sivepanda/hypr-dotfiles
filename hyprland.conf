
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

source = ~/.config/hypr/colors.conf

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=desc:Acer Technologies XF273U W2 0x01010101, 2560x1440@144.00, 0x0, 1
# monitor=eDP-1, 1900x1200@60, 2560x0, 1.25

monitor=eDP-1, 1900x1200@60, 0x0, 1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty +new-window
$fileManager = nautilus 
$menu = vicinae toggle


#################
### AUTOSTART ###
#################

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = waybar & hyprpaper & solaar & openrgb & hypridle
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=nmcli d connect wlp8s0
exec-once=bluetoothctl trust AC:BF:71:C8:79:F9
exec-once=vicinae server
exec-once= /home/siven/.local/bin/randwallpaper
exec-once=systemctl enable --user app-com.mitchellh.ghostty.service
exec-once = /usr/lib/polkit-kde-authentication-agent-1


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 3

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $primary $secondary_dim 45deg
    col.inactive_border = $outline_dim

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    # default to dwindle on non primary workspaces
    layout = dwindle
}


env = DRI_PRIME,0
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 3

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9

    # DISABLED FOR BATTERY PRESERVATION
    # shadow {
    #     enabled = true
    #     range = 4
    #     render_power = 3
    #     color = $surface_dim
    # }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 6
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = eazy,0.17,0.24,0.28,1
    bezier = bouncy,0,0.63,0.31,1.11
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = smooth,0.5,0.06,0.31,0.98

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 3, eazy, gnomed 
    animation = windowsIn, 1, 3, bouncy, gnomed 
    animation = windowsOut, 1, 1.49, bouncy, popin 87% 
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

layerrule = xray on, match:namespace hyprlock
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace vicinae 

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

scrolling {
    focus_fit_method = 1
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true 
        scroll_factor = 0.6
        tap-to-click = false
        clickfinger_behavior = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe_distance = 3
}

gesture = 4, horizontal, workspace 
gesture = 4, up, dispatcher, exec, $menu

gesture = 3, left, dispatcher, layoutmsg, move +col
gesture = 3, right, dispatcher, layoutmsg, move -col
gesture = 3, up, dispatcher, layoutmsg, promote


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

xwayland {
    force_zero_scaling = true
}


###################
### KEYBINDINGS ###
###################
# See https://wiki.hyprland.org/Configuring/Keywords/
# See https://wiki.hyprland.org/Configuring/Binds/ for binding docs

$mainMod = SUPER

unbind = $mainMod, D,
unbind = $mainMod, L,
unbind = $mainMod, S,
unbind = $mainMod, M,
bindd = $mainMod, Q, Terminal, exec, $terminal
bindd = $mainMod, R, Launcher, exec, $menu
bindd = $mainMod, E, Files, exec, $fileManager
bindd = $mainMod, C, Close window, killactive,
bindd = $mainMod, D, Discord, exec, discord
bindd = $mainMod, M, Power menu, exec, /usr/bin/hyprshutdown
bindd = $mainMod, S, Spotify, exec, spotify
bindd = $mainMod, F, Browser, exec, /usr/bin/zen/zen
bindd = $mainMod CTRL, Z, Zoom, exec, zoom
bindd = $mainMod, L, Lock screen, exec, hyprlock
bindd = $mainMod, K, Color picker, exec, hyprpicker -a
bindd = $mainMod SHIFT, R, Clipboard History, exec, vicinae vicinae://extensions/vicinae/clipboard/history
bindd = $mainMod CTRL, F, Zen Tabs, exec, vicinae vicinae://extensions/vicinae/browser-extension/browse-tabs

# WM

# Tiling WM (Dwindle) stuff
bindd  = $mainMod, J, Toggle split, togglesplit,
bindde = $mainMod CTRL, K, Next workspace, workspace, e+1
bindde = $mainMod CTRL, J, Prev workspace, workspace, e-1

# Scrolling WM Motions
bindd = $mainMod, P, Promote window, layoutmsg, promote
bindd = $mainMod CTRL, H, Move column right, layoutmsg, move +col
bindd = $mainMod CTRL, L, Move column left, layoutmsg, move -col
bindd = $mainMod, period, Swap column right, layoutmsg, swapcol r
bindd = $mainMod, comma, Swap column left, layoutmsg, swapcol l
bindd = $mainMod, mouse_up, Move column right, layoutmsg, move +col
bindd = $mainMod, mouse_down, Move column left, layoutmsg, move -col


# Motions

# Scroll through existing workspaces with mainMod + scroll
bindde = $mainMod SHIFT, K, Move to next workspace, movetoworkspace, e+1
bindde = $mainMod SHIFT, J, Move to prev workspace, movetoworkspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Move focus with mainMod + arrow keys
bindde = $mainMod CTRL, H, Focus left, movefocus, l
bindde = $mainMod CTRL, L, Focus right, movefocus, r
bindde = $mainMod CTRL, K, Focus up, movefocus, u
bindde = $mainMod CTRL, J, Focus down, movefocus, d

bindde = $mainMod, left, Focus left, movefocus, l
bindde = $mainMod, right, Focus right, movefocus, r
bindde = $mainMod, up, Focus up, movefocus, u
bindde = $mainMod, down, Focus down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# System

# Lid Switch
bindld = , switch:Lid Switch, Lock on lid close, exec, hyprlock

# Brightness
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, brightnessctl s 5%+
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, brightnessctl s 5%-


#Multimedia

# Laptop multimedia keys for volume and LCD brightness
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = ,XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = ,XF86AudioMute, Mute audio, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = ,XF86AudioMicMute, Mute mic, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindld = $mainMod, XF86AudioRaiseVolume, Next track, exec, playerctl next
bindld = $mainMod, XF86AudioLowerVolume, Previous track, exec, playerctl previous
bindld = , XF86AudioPause, Play/pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play/pause, exec, playerctl play-pause


# Screenshots with hyprshot
bindd = $mainMod, PRINT, Screenshot window, exec, hyprshot -m window
bindd = , PRINT, Screenshot region, exec, hyprshot -m region
bindd = $mainMod SHIFT, PRINT, Screenshot monitor, exec, hyprshot -m output


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
