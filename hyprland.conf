
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-3, 2560x1440@165, 0x0, 1
# monitor=DP-3, 2560x1440@240, 0x0, 1
workspace=1,monitor:DP-3
# monitor= HDMI-A-3, 1920x1080, 2560x0, 1
# workspace=2,monitor:HDMI-A-3

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty 
$fileManager = nautilus 
$menu = vicinae toggle


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = hyprctl setcursor Adwaita 24
exec-once = systemctl --user start hyprpolkitagent
exec-once=waybar & hyprpaper & solaar & openrgb & hypridle
exec-once=dbus-update-activation-environment --all
exec-once=vicinae server

# network login?
# exec-once=eval $(gnome-keyring-daemon --start --components=secrets)
# exec-once=export SSH_AUTH_SOCK
# exec-once=export GPG_AGENT_INFO
#
exec-once=nmcli d connect wlp8s0
exec-once=bluetoothctl trust AC:BF:71:C8:79:F9



#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace vicinae 
layerrule = dim_around on, match:namespace vicinae
layerrule = ignore_alpha 0, match:namespace vicinae

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 5

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(0600abff) rgba(ff000044) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle



}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 1

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = smooth,0.5,0.06,0.31,0.98

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 3, smooth 
    animation = windowsIn, 1, 3, smooth, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}


# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

xwayland {
    force_zero_scaling = true
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bindd = $mainMod, C, Kill Window, killactive,
bindd = $mainMod, M, Exit Hyprland, exit,
bindd = $mainMod, V, Toggle Floating Window, togglefloating,
bindd = $mainMod, P, Toggle PseudoTile, pseudo, # dwindle
bindd = $mainMod, J, Toggle Dwindle Split, togglesplit, # dwindle
unbind = $mainMod, D,
unbind = $mainMod, L,
unbind = $mainMod, S,
bindd = $mainMod, Q, Open Ghostty, exec, ghostty +new-window
bindd = $mainMod, R, Open Menu, exec, $menu
bindd = $mainMod, E, Open File Manager, exec, $fileManager
bindd = $mainMod, D, Open Discord, exec, discord 
bindd = $mainMod, S, Open Spotify, exec, spotify
bindd = $mainMod, F, Open Zen, exec, zen 
bindd = $mainMod, L, Start Hyprlock, exec, hyprlock
bindd = $mainMod CTRL, S, Start Slack, exec, slack 
bindd = $mainMod CTRL, Z, Open Zoom , exec, zoom 

# Brightness Control with DDCUtil (external monitors)
bind = $mainMod,Prior, exec, ddcutil setvcp 10 + 10 # Decrease Brightness
bind = $mainMod,Next, exec, ddcutil setvcp 10 - 10 # Increase Brightness

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l # Focus window left
bind = $mainMod, right, movefocus, r # Focus window right
bind = $mainMod, up, movefocus, u # Focus window up
bind = $mainMod, down, movefocus, d # Focus window down 

# Move focus with mainMod + SHIFT + vim keybinds
bind = $mainMod SHIFT, H, movefocus, l # Focus window left
bind = $mainMod SHIFT, L, movefocus, r # Focus window right
bind = $mainMod SHIFT, K, movefocus, u # Focus window up
bind = $mainMod SHIFT, J, movefocus, d # Focus window down

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1 # Switch to workspace 1
bind = $mainMod, 2, workspace, 2 # Switch to workspace 2
bind = $mainMod, 3, workspace, 3 # Switch to workspace 3
bind = $mainMod, 4, workspace, 4 # Switch to workspace 4
bind = $mainMod, 5, workspace, 5 # Switch to workspace 5
bind = $mainMod, 6, workspace, 6 # Switch to workspace 6
bind = $mainMod, 7, workspace, 7 # Switch to workspace 7
bind = $mainMod, 8, workspace, 8 # Switch to workspace 8
bind = $mainMod, 9, workspace, 9 # Switch to workspace 9
bind = $mainMod, 0, workspace, 10 # Switch to workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Move to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Move to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Move to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Move to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Move to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Move to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Move to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Move to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Move to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Move to workspace 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1 # Scroll to next workspace
bind = $mainMod, mouse_up, workspace, e-1 # Scroll to previous workspace

# Scroll through existing workspaces with mainMod + CTRL (vim up/down)
bind = $mainMod CTRL, K, workspace, e+1 
bind = $mainMod CTRL, J, workspace, e-1


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


# Screenshots with hyprshot
bind = $mainMod, PRINT, exec, hyprshot -m window # for window
bind = , PRINT, exec, hyprshot -m region # for region 
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m output # for monitor


misc {
    disable_splash_rendering = true
    disable_hyprland_logo = true
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
